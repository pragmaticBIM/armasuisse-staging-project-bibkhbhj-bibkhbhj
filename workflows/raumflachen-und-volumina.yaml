id: armasuisse:workflow/raumflachen-und-volumina
sort_order: 6
code: AWF-01
name:
  de: Raumflächen und Volumina
  fr: Surfaces et volumes des locaux
  it: Superfici e volumi
  en: ''
description:
  de: '**Beschrieb:**

    Bezeichnungen, Flächen und Nutzungszuordnung der Räume werden gemäss Vorgabe des Elementplan im digitalen Modell erfasst. Der Export dieser Informationen als strukturiertes Datenobjekt soll gemäss Vorgabe
    möglich sein. Jede Raumfläche verfügt über eine eindeutige Raumnummer und Flächenart.


    **Ziele:**

    - Das Raumbuch des Projekts kann jederzeit mit der Planung abgeglichen werden


    Nutzen für den Auftraggeber

    - Auswertbarkeit der Flächen und Volumen inkl. Verfolgbarkeit im Projektverlauf

    - bessere Koordination von Rauminformationen zwischen den verschiedenen Planungsdisziplinen

    - Übersicht durch räumliche Darstellung


    **Lieferobjekte:**

    - 3D-Modell(e)

    - Auswertungen im Excel-Format'
  fr: '**Description:**

    Les désignations, les surfaces et l’attribution de l’utilisation des locaux sont saisies dans le modèle numérique selon les directives de l’Elementplan. Il doit être possible d’exporter ces informations
    en tant qu’objet de données structuré selon la directive. Chaque surface de local dispose d’un numéro de local unique et d’un type de surface.


    **Objectif:**

    - Le cahier des locaux du projet peut être comparé à tout moment avec la planification


    **Plus-value:**

    - Caractère exploitable des surfaces et volumes, y compris traçabilité dans le courant du projet

    - Meilleure coordination des informations sur les locaux entre les disciplines intervenant dans la planification

    - Vue d’ensemble grâce à la représentation spatiale


    **Objets à livrer:**

    - Modèle(s) en 3D

    - Relevés au format Excel'
  it: '**Descrizione:**

    Le denominazioni, le superfici e la destinazione d’uso dei locali sono registrate nel modello digitale secondo le disposizioni dell’Elementplan. Queste informazioni devono poter essere esportate come
    oggetti dati strutturati secondo le disposizioni. Ogni superficie di locale dispone di un numero di locale univoco e di una tipologia di superficie.


    **Obiettivi:**

    - Il registro degli spazi del progetto può essere allineato in qualsiasi momento alla pianificazione


    **Valore aggiunto:**

    - Possibilità di analizzare superfici e volumi, inclusa la tracciabilità nel corso del progetto

    - Migliore coordinamento delle informazioni relative ai locali tra le varie discipline della pianificazione

    - Panoramica tramite rappresentazione spaziale


    **Oggetti della fornitura:**

    - Modello/i 3D

    - Valutazioni in formato Excel'
