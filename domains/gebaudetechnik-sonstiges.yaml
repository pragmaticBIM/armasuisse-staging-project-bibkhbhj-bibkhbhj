id: armasuisse:domain/gebaudetechnik-sonstiges
name:
  de: Sonstiges
  fr: Autres
  it: Altro
  en: ''
definition:
  de: "Beispiel: `APB-000311_1233-NB_31_KUT_Freitext`\n(\"/\" muss durch ein \"-\" ersetzt werden)\n\nDas Fachmodell Gebäudetechnik Sonstiges umfasst alle gebäudetechnischen Planungsinhalte, die nicht den\
    \ Teilbereichen HLK, Sanitär oder Elektro zugeordnet sind – z. B. Küchen-, Medizin-, Verlade- und Werkstatttechnik sowie übergeordnete Koordinations- und Referenzmodelle. Es kann projektspezifisch in\
    \ weitere Teilmodelle unterteilt werden, um die Planungsverantwortlichkeiten klar darzustellen.\n\nDer Dateiname setzt sich zusammen aus:\n- **Auftrags-Nr Bauherr** (Projektnummer) gem. armasuisse Immobilien\n\
    \ - **Gebäude ID** gem. armasuisse Immobilien\n- **Projektphase**\n    - 00: Bestandsaufnahme\n    - 11: Bedürfnisformulierung\n    - 21: Projektdefinition, Machbarkeit\n    - 22: Auswahlverfahren\n\
    \    - 31: Vorprojekt\n    - 32: Bauprojekt\n    - 33: Bewilligungsverfahren, Auflageprojekt\n    - 41: Ausschreibung\n    - 51: Ausführungsprojekt\n    - 52: Ausführung\n    - 53: Inbetriebnahme\n\
    \    - 61: Betrieb\n    - 62: Erhaltung\n- **Disziplin**\n    - GTA: Gebäudetechnikmodell\n    - KOO: TGA-Koordinationsmodell\n    - KUT: Küchentechnikmodell\n    - MED: Medizintechnikmodell\n    -\
    \ VLT: Verladetechnikmodell\n    - WKL: Werksleitungsmodell\n    - WSP: Werkstattplanungsmodell\n    - MEG: Medizinisches Gasemodell\n    - VDM: Vakuum- und Druckluftmodell\n    - XXX: Andere Modelle\n\
    - **Freitext**\n \nDer Dateiname *kann* projektspezifisch frei ergänzt werden. z.B. Workbreakdownstructure, Status, ...\n\nWenn Modelle als Gliederungsebene für Neu/Bestand/Abbruch/Tempoär eingesetzt\
    \ werden, was wir beim Start mit BIM empfehlen, muss im Modellnamen erwähnt werden, welche Inhalte enthalten sind. d.h. Status ist entweder:\n- Neu: beinhaltet nur neu zu erstellende Modelle\n- Bestand:\
    \ Zeigt nur die Elemente aus dem Bestand die auch bestehen bleiben.\n- Abbruch: Zeigt nur die Elemente die abgebrochen werden.\n    - Temporär: Zeigt nur Inhalte während der Bauphase."
  fr: "Exemple : « APB-000311_1233-NB_31_KUT_Texte-Libre » (le \"/\" doit être remplacé par un \"-\")\n\nLe modèle spécialisé Techniques du bâtiment Autres englobe tous les contenus de planification de\
    \ la technique du bâtiment qui ne relèvent pas des sous-domaines CVC, sanitaire ou électricité – p. ex. la technique de cuisine, médicale, de chargement et d'atelier ainsi que les modèles de coordination\
    \ et de référence globaux. Il peut être subdivisé en sous-modèles spécifiques au projet afin de présenter clairement les responsabilités en matière de planification.\n\nLe nom du fichier se compose\
    \ comme suit :\n- **Numéro de commande Maître d'ouvrage** (numéro de projet) selon armasuisse Immobilier\n- **ID du bâtiment** selon armasuisse Immobilier\n- **Phase du projet** :\n    - 00 : état des\
    \ lieux\n    - 11 : Formulation des besoins\n    - 21 : définition du projet, faisabilité\n    - 22 : Procédure de sélection\n    - 31 : Avant-projet\n    - 32 : Projet de construction\n    - 33 : Procédure\
    \ d'autorisation, projet de mise à l'enquête\n    - 41 : Appel d'offres\n    - 51 : Projet d'exécution\n    - 52 : Exécution\n    - 53 : Mise en service\n    - 61 : exploitation\n    - 62 : Maintien\n\
    \ - **Discipline :**\n    - GTA : Modèle CVCSER\n    - KOO : Modèle Coordination CVCSE\n    - KUT : Modèle Cuisine\n    - MED : Modèle Technologie médicale\n    - VLT : Modèle de technique de chargement\n\
    \    - WKL : Modèle des réseaux (utilités)\n    - WSP : Modèle de planification d'atelier\n    - MEG : Modèle Gaz médicaux\n    - VDM : Modèle de vide et d'air comprimé\n    - XXX : Autres modèles\n\
    \ - **Texte libre**\n\nLe nom du fichier *peut* être complété librement en fonction du projet. Par exemple : structure de répartition du travail, statut, ...\n\nSi les modèles sont utilisés comme niveau\
    \ de structure pour les éléments nouveaux/existants/à démolir/temporaires, ce que nous recommandons au début avec BIM, le nom du modèle doit mentionner le contenu qu'il contient. Le statut est donc\
    \ soit :\n- Nouveau : ne contient que les modèles à créer\n- Existant : n'affiche que les éléments existants qui resteront inchangés.\n- Démolition : n'affiche que les éléments qui seront démolis.\n\
    - Temporaire : n'affiche que le contenu pendant la phase de construction."
  it: "Esempio: `APB-000311_1233-NB_31_KUT_Testo-Libero` (la barra \"/\" deve essere sostituita da un trattino \"-\")\n\nIl modello specialistico Tecnica degli edifici Altro comprende tutti i contenuti\
    \ di progettazione della tecnica degli edifici non attribuiti ai sottoambiti RVC, sanitario o elettrico – ad es. tecnologia di cucina, medica, di carico e di officina nonché i modelli di coordinamento\
    \ e di riferimento complessivi. Deve essere suddiviso in modelli parziali specifici per ogni progetto, al fine di rappresentare chiaramente le responsabilità di progettazione.\n\nIl nome del file è\
    \ composto da:\n- **Numero d'ordine Committente** (numero di progetto) secondo armasuisse Immobili\n- **ID edificio** secondo armasuisse Immobili\n- **Fase di progetto**\n    - 00 : inventario delle\
    \ attrezzature\n    - 11 : formulazione dei requisiti\n    - 21 : Definizione del progetto, fattibilità\n    - 22 : Procedura di selezione\n    - 31 : Progetto preliminare\n    - 32 : Progetto di costruzione\n\
    \    - 33 : Procedura di autorizzazione, progetto di indagine\n    - 41 : Bando di gara\n    - 51 : Progetto esecutivo\n    - 52 : Esecuzione\n    - 53: Messa in servizio\n    - 61: Gestione operativa\n\
    \    - 62: Manutenzione\n- **Disciplina**\n    - GTA: Modello degli impianti tecnici dell'edificio\n    - KOO: Modello di coordinamento impianti - MEP\n    - KUT: Modello di tecnologia di cucina\n \
    \   - MED: Modello di tecnologia medica\n    - VLT: Modello di tecnologia di carico\n    - WKL: Modello delle reti dei sottoservizi\n    - WSP: Modello di pianificazione officina\n    - MEG: Modello\
    \ dei gas medicali\n    - VDM: Modello di vuoto e aria compressa\n    - XXX: Altri modelli\n- **Testo libero**\n\nIl nome del file *può* essere completato liberamente in base al progetto, ad es. struttura\
    \ di suddivisione del lavoro, stato, ...\n\nSe i modelli vengono utilizzati come livello di struttura per nuovo/esistente/demolizione/temporaneo, cosa che consigliamo all'inizio con il BIM, nel nome\
    \ del modello deve essere indicato quale contenuto è incluso. Lo stato può essere:\n- Nuovo: contiene solo modelli da creare ex novo\n- Esistente: mostra solo gli elementi esistenti che rimarranno invariati.\n\
    \ - Demolizione: mostra solo gli elementi che saranno demoliti.\n- Temporaneo: mostra solo i contenuti durante la fase di costruzione."
  en: ''
file_name:
  de: '{Auftrags-Nr Bauherr}_{Bauwerk ID}_{Phase}_{Disziplin}_{Freitext}'
