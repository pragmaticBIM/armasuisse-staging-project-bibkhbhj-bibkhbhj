  de: "Modell um den Einsatzplan der Feuerwehr zu prüfen.\n\n- **Auftrags-Nr Bauherr** gemäss armasuisse Immobilien\n- **Gebäude ID** gemäss armasuisse Immobilien\n- **Projektphase**:\n    - 00: Bestandsaufnahme\n\
