id: armasuisse:domain/nachweismodell-sanitar
sort_order: 4
name:
  de: Nachweismodell Sanitär
  fr: Maquette de vérification Sanitaire
  it: Modello di verifica Idrosanitario
  en: ''
definition:
  de: Das *Nachweismodell Sanitär* ist ein Teil des Nachweismodells Beschaffung. Es enthält die Informationsanforderungen, die im Rahmen der Angebotsverfahren vom anbietenden Unternehmen erfüllt werden
    müssen. Ob das Nachweismodell als Eignung- oder Zuschlagskriterium eingesetzt wird, und welcher Erfüllungsgrad gefordert ist, ist den Ausschreibungsunterlagen zu entnehmen.
  fr: Le *modèle de preuve sanitaire* fait partie du modèle de preuve d'approvisionnement. Il contient les exigences d'information que l'entreprise offrante doit remplir dans le cadre des procédures d'appel
    d'offres. Si le modèle de preuve est utilisé comme critère d'admissibilité ou d'attribution, et quel degré de conformité est requis, est à déterminer dans les documents de la procédure de passation.
  it: Il *modello di prova sanitario* fa parte del modello di prova di approvvigionamento. Contiene i requisiti informativi che l'azienda offerente deve soddisfare nell'ambito delle procedure di gara. Se
    il modello di prova viene utilizzato come criterio di idoneità o di aggiudicazione, e quale grado di conformità è richiesto, va desunto dai documenti di gara.
  en: ''
file_name:
