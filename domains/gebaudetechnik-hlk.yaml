id: armasuisse:domain/gebaudetechnik-hlk
name:
  de: Gebäudetechnik HLK
  fr: Techniques du bâtiment CVC
  it: Tecnica degli edifici RVC
  en: ''
definition:
  de: "Beispiel: `APB-000311_1233-NB_31_HLK_Freitext`\n(\"/\" muss durch ein \"-\" ersetzt werden)\n\nDas Fachmodell Gebäudetechnik HLK umfasst alle Planungsinhalte aus den Bereichen Heizung, Lüftung, Klima\
    \ und Kälte. Es kann projektspezifisch in weitere Teilmodelle unterteilt werden, um die Planungsverantwortlichkeiten klar darzustellen.\n\nDer Dateiname setzt sich zusammen aus:\n- **Auftrags-Nr Bauherr**\
    \ (Projektnummer) gem. armasuisse Immobilien\n- **Gebäude ID** gem. armasuisse Immobilien\n- **Projektphase**\n    - 00: Bestandsaufnahme\n    - 11: Bedürfnisformulierung\n    - 21: Projektdefinition,\
    \ Machbarkeit\n    - 22: Auswahlverfahren\n    - 31: Vorprojekt\n    - 32: Bauprojekt\n    - 33: Bewilligungsverfahren, Auflageprojekt\n    - 41: Ausschreibung\n    - 51: Ausführungsprojekt\n    - 52:\
    \ Ausführung\n    - 53: Inbetriebnahme\n    - 61: Betrieb\n    - 62: Erhaltung\n- **Disziplin**\n    - HEI: Heizungsmodell\n    - HLK: HLK-Modell\n    - KAL: Kältemodell\n    - LUF: Lüftungsmodell\n\
    \    - FEW: Fernwärmemodell\n    - RWA: Rauch- und Wärmeabzugsanlagenmodell\n- **Freitext**\n\nDer Dateiname *kann* projektspezifisch frei ergänzt werden. z.B. Workbreakdownstructure, Status, ...\n\n\
    \ Wenn Modelle als Gliederungsebene für Neu/Bestand/Abbruch/Tempoär eingesetzt werden, was wir beim Start mit BIM empfehlen, muss im Modellnamen erwähnt werden, welche Inhalte enthalten sind. d.h. Status\
    \ ist entweder:\n- Neu: beinhaltet nur neu zu erstellende Modelle\n- Bestand: Zeigt nur die Elemente aus dem Bestand die auch bestehen bleiben.\n- Abbruch: Zeigt nur die Elemente die abgebrochen werden.\n\
    \ - Temporär: Zeigt nur Inhalte während der Bauphase."
  fr: "Exemple : « APB-000311_1233-NB_31_HLK_Texte-Libre » (le \"/\" doit être remplacé par un \"-\")\n\nLe modèle spécialisé Techniques du bâtiment CVC englobe tous les contenus de planification des domaines\
    \ chauffage, ventilation, climatisation et froid. Il peut être subdivisé en sous-modèles spécifiques au projet afin de présenter clairement les responsabilités en matière de planification.\n\nLe nom\
    \ du fichier se compose comme suit :\n- **Numéro de commande Maître d'ouvrage** (numéro de projet) selon armasuisse Immobilier\n- **ID du bâtiment** selon armasuisse Immobilier\n- **Phase du projet**\
    \ :\n    - 00 : état des lieux\n    - 11 : Formulation des besoins\n    - 21 : définition du projet, faisabilité\n    - 22 : Procédure de sélection\n    - 31 : Avant-projet\n    - 32 : Projet de construction\n\
    \    - 33 : Procédure d'autorisation, projet de mise à l'enquête\n    - 41 : Appel d'offres\n    - 51 : Projet d'exécution\n    - 52 : Exécution\n    - 53 : Mise en service\n    - 61 : exploitation\n\
    \    - 62 : Maintien\n- **Discipline :**\n    - HEI : Modèle Chauffage\n    - HLK : Modèle CVC\n    - KAL : Modèle Froid\n    - LUF : Modèle Ventilation\n    - FEW : Modèle de chauffage à distance\n\
    \    - RWA : Modèle des installations de désenfumage et d'évacuation de chaleur\n- **Texte libre**\n\nLe nom du fichier *peut* être complété librement en fonction du projet. Par exemple : structure\
    \ de répartition du travail, statut, ...\n\nSi les modèles sont utilisés comme niveau de structure pour les éléments nouveaux/existants/à démolir/temporaires, ce que nous recommandons au début avec\
    \ BIM, le nom du modèle doit mentionner le contenu qu'il contient. Le statut est donc soit :\n- Nouveau : ne contient que les modèles à créer\n- Existant : n'affiche que les éléments existants qui resteront\
    \ inchangés.\n- Démolition : n'affiche que les éléments qui seront démolis.\n- Temporaire : n'affiche que le contenu pendant la phase de construction."
  it: "Esempio: `APB-000311_1233-NB_31_HLK_Testo-Libero` (la barra \"/\" deve essere sostituita da un trattino \"-\")\n\nIl modello specialistico Tecnica degli edifici RVC comprende tutti i contenuti di\
    \ progettazione degli ambiti riscaldamento, ventilazione, climatizzazione e raffrescamento. Deve essere suddiviso in modelli parziali specifici per ogni progetto, al fine di rappresentare chiaramente\
    \ le responsabilità di progettazione.\n\nIl nome del file è composto da:\n- **Numero d'ordine Committente** (numero di progetto) secondo armasuisse Immobili\n- **ID edificio** secondo armasuisse Immobili\n\
    \ - **Fase di progetto**\n    - 00 : inventario delle attrezzature\n    - 11 : formulazione dei requisiti\n    - 21 : Definizione del progetto, fattibilità\n    - 22 : Procedura di selezione\n    -\
    \ 31 : Progetto preliminare\n    - 32 : Progetto di costruzione\n    - 33 : Procedura di autorizzazione, progetto di indagine\n    - 41 : Bando di gara\n    - 51 : Progetto esecutivo\n    - 52 : Esecuzione\n\
    \    - 53: Messa in servizio\n    - 61: Gestione operativa\n    - 62: Manutenzione\n- **Disciplina**\n    - HEI: Modello di riscaldamento\n    - HLK: Modello HVAC\n    - KAL: Modello di refrigerazione\n\
    \    - LUF: Modello di ventilazione\n    - FEW: Modello di teleriscaldamento\n    - RWA: Modello degli impianti di evacuazione fumo e calore\n- **Testo libero**\n\nIl nome del file *può* essere completato\
    \ liberamente in base al progetto, ad es. struttura di suddivisione del lavoro, stato, ...\n\nSe i modelli vengono utilizzati come livello di struttura per nuovo/esistente/demolizione/temporaneo, cosa\
    \ che consigliamo all'inizio con il BIM, nel nome del modello deve essere indicato quale contenuto è incluso. Lo stato può essere:\n- Nuovo: contiene solo modelli da creare ex novo\n- Esistente: mostra\
    \ solo gli elementi esistenti che rimarranno invariati.\n- Demolizione: mostra solo gli elementi che saranno demoliti.\n- Temporaneo: mostra solo i contenuti durante la fase di costruzione."
  en: ''
file_name:
  de: '{Auftrags-Nr Bauherr}_{Bauwerk ID}_{Phase}_{Disziplin}_{Freitext}'
  fr: ''
  it: ''
  en: ''
