id: armasuisse:domain/tiefbau
sort_order: 10
name:
  de: Tiefbau
  fr: Génie civil
  it: Ingegneria civile
  en: ''
definition:
  de: "Beispiel: `APB-000311_1233_31_BIN-WA_Freitext`\n(\"/\" muss durch ein \"-\" ersetzt werden)\n\nDie Fachmodelle Tiefbau beinhalten alle Planungsinhalte und müssen projektspezifisch in weitere Teilmodelle\
    \ aufgeteilt werden.\n\nDer Dateiname setzt sich zusammen aus:\n\n- **Auftrags-Nr Bauherr** (Projektnummer) gem. armasuisse Immobilien\n- **Gebäude ID** gem. armasuisse Immobilien (für den Tiefbau eventuell\
    \ eine ID des Bauabschnitts)\n- **Projektphase**\n    - 00: Bestandsaufnahme\n    - 11: Bedürfnisformulierung\n    - 21: Projektdefinition, Machbarkeit\n    - 22: Auswahlverfahren\n    - 31: Vorprojekt\n\
    \    - 32: Bauprojekt\n    - 33: Bewilligungsverfahren, Auflageprojekt\n    - 41: Ausschreibung\n    - 51: Ausführungsprojekt\n    - 52: Ausführung\n    - 53: Inbetriebnahme\n    - 61: Betrieb\n   \
    \ - 62: Erhaltung\n- **Disziplin**\n    - BIN-AW: Tiefbau Abwasser\n    - BIN-EW: Tiefbau Elektrizität\n    - BIN-FW: Tiefbau Fernwärme\n    - BIN-GA: Tiefbau Gas\n    - BIN-KO : Tiefbau Kommunikation\n\
    \    - BIN-WA: Tiefbau Wasser\n    - Bei Bedarf weitere Modelle projektspezifisch definieren\n\n**Freitext nach Projektanforderungen**\n\nDer Dateiname *kann* projektspezifisch frei ergänzt werden.\
    \ z.B. Workbreakdownstructure, Status, ...\n\nWenn Modelle als Gliederungsebene für Neu/Bestand/Abbruch/Tempoär eingesetzt werden, was wir beim Start mit BIM empfehlen, muss im Modellnamen erwähnt werden,\
    \ welche Inhalte enthalten sind. d.h. Status ist entweder:\n- Neu: beinhaltet nur neu zu erstellende Modelle\n- Bestand: Zeigt nur die Elemente aus dem Bestand die auch bestehen bleiben.\n- Abbruch:\
    \ Zeigt nur die Elemente die abgebrochen werden.\n- Temporär: Zeigt nur Inhalte während der Bauphase."
  fr: "Exemple : `APB-000311_1233-NB_31_BIN-WA_Texte-Libre`\n(\"/\" doit être remplacé par un \"-\")\n\nLes modèles spécialisés du génie civil contiennent tous les contenus de planification et doivent être\
    \ subdivisés en sous-modèles spécifiques au projet.\n\nLe nom du fichier se compose comme suit :\n\n-  **Numéro de mandat du maître d'ouvrage** selon armasuisse Immobilier\n-   **ID du bâtiment** selon\
    \ armasuisse Immobilier\n-   **Phase du projet** :\n    - 00 : état des lieux      \n    - 11 : Formulation des besoins      \n    - 21 : définition du projet      \n    - 22 : Procédure de sélection\
    \      \n    - 31 : Avant-projet      \n    - 32 : Projet de construction      \n    - 33 : Procédure d'autorisation      \n    - 41 : Appel d'offres      \n    - 51 : Projet d'exécution     \n    -\
    \  52 : Exécution      \n    - 53 : Mise en service      \n    - 61 : exploitation      \n    - 62 : Maintien\n-   **Discipline:**\n    - BIN-AW : génie civil, eaux usées\n    - BIN-EW : génie civil,\
    \ électricité\n    - BIN-FW : génie civil, chauffage urbain\n    - BIN-GA : génie civil, gaz\n    - BIN-KO : génie civil, communication\n    - BIN-WA : génie civil, eau\n    - Si nécessaire, définir\
    \ d'autres modèles spécifiques au projet.\n\n\"Texte libre selon les exigences du projet\"\n\nLe nom de fichier *peut* être complété par des informations supplémentaires spécifiques au projet\n\nLe\
    \ nom du fichier *peut* être complété librement en fonction du projet. Par exemple : workbreakdownstructure, statut, ...\n\nSi les modèles sont utilisés comme niveau de structure pour les éléments nouveaux/existants/à\
    \ démolir/temporaires, ce que nous recommandons lors du démarrage avec BIM, le nom du modèle doit mentionner le contenu qu'il contient. Autrement dit, le statut est soit :\n- Nouveau : ne contient que\
    \ les modèles à créer\n- Existant : n'affiche que les éléments existants qui resteront en place.\n- À démolir : n'affiche que les éléments qui seront démolis.\n- Temporaire : affiche uniquement le contenu\
    \ pendant la phase de construction."
  it: "Esempio: `APB-000311_1233-NB_31_BIN-WA_Testo-Libero`\n(\"/\" deve essere sostituito da un \"-\")\n\nI modelli specialistici di ingegneria civile contengono tutti i contenuti di pianificazione e devono\
    \ essere suddivisi in ulteriori sottomodelli specifici per il progetto.\n\nLe nom du fichier se compose comme suit :\n- **Numéro de commande Maître d'ouvrage** (numéro de projet) selon armasuisse Immobilier\n\
    - **ID du bâtiment** selon armasuisse Immobilier (pour le génie civil, éventuellement un ID de la phase de construction)\n- **Phase du projet**\n    - 00 : inventario delle attrezzature    \n    - 11\
    \ : formulazione dei requisiti    \n    - 21 : Definizione del progetto    \n    - 22 : Procedura di selezione    \n    - 31 : Progetto preliminare    \n    - 32 : Progetto di costruzione    \n    -\
    \ 33 : Procedura di autorizzazione    \n    - 41 : Bando di gara    \n    - 51 : Progetto esecutivo    \n    - 52 : Esecuzione    \n    - 53: Messa in servizio    \n    - 61: Gestione operativa    \n\
    \    - 62: Manutenzione \n- **Disciplina**\n    - BIN-AW: Ingegneria civile - Acque reflue\n    - BIN-EW: Ingegneria civile - Elettricità\n    - BIN-FW: Ingegneria civile - Teleriscaldamento\n    -\
    \ BIN-GA: Ingegneria civile - Gas\n    - BIN-KO : Ingegneria civile - Comunicazioni\n    - BIN-WA: Ingegneria civile - Acqua\n    - Se necessario, definire ulteriori modelli specifici per il progetto.\n\
    \n\"Testo libero secondo i requisiti del progetto\"\n\nIl nome del file *può* essere completato liberamente in base al progetto. Ad esempio: struttura di suddivisione del lavoro, stato, ...\n\nSe i\
    \ modelli vengono utilizzati come livello di struttura per nuovo/esistente/demolizione/temporaneo, cosa che consigliamo all'inizio con il BIM, nel nome del modello deve essere indicato quale contenuto\
    \ è incluso. Ciò significa che lo stato è:\n- Nuovo: contiene solo modelli da creare ex novo\n- Esistente: mostra solo gli elementi esistenti che rimangono invariati.\n- Demolizione: mostra solo gli\
    \ elementi che vengono demoliti.\n- Temporaneo: mostra solo i contenuti durante la fase di costruzione."
  en: ''
