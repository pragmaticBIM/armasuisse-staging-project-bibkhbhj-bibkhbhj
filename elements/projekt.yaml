definition:
  de: 'Das Projekt dient als logische Gliederungsebene und muss in jeder IFC Datei gepflegt sein, sodass die Dateien eindeutig den Projekten zugeordnet werden können.


    Die Attributswerte werden durch den Bauherr im Modell "Referenz Perimeter" geliefert.'
  fr: "Le projet sert d’articulation logique et doit être mis à jour dans chaque fichier IFC de telle sorte que les fichiers puissent être attribués sans équivoque aux projets. \n\nLes valeurs d’attribut\
    \ sont fournies par l’auteur de la commande dans le modèle de périmètre de projet et doivent être reprises par tous les participants du projet."
  it: "Il progetto funge da livello di suddivisione logica e deve essere indicato in ogni file IFC in maniera che i file stessi possano essere associati in modo univoco ai progetti.  \n\nI valori degli\
    \ attributi vengono forniti dal committente nel modello di \"riferimento Perimetro\"."
  en: ''
