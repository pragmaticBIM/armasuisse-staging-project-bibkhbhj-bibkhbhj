name:
  de: Freihaltefläche Feuerwehr
  fr: Surface à maintenir libre
  it: Area da mantenere libera
  en: Clearance area
needed_in_domain:
- armasuisse:domain/einsatzplan-feuerwehr
definition:
  de: 'Die freizuhaltender Flächen für Feuerwehr-Anfahrten und Zufahrten im Modell.


    **Modellierungshinweis:**

    Die Freihaltefläche wird mit Höhe 1m extrudiert modelliert.'
  fr: 'La surface à maintenir libre est un symbole (IfcSpace) pour la représentation spatiale des surfaces à maintenir libres pour les accès et voies d''intervention des pompiers dans le modèle.


    **Note pour la modélisation :**

    La surface à maintenir libre est modélisée comme IfcSpace par extrusion avec une hauteur de 1 m et placée dans la zone où l''exigence correspondante est pertinente.'
  it: 'L''area da mantenere libera è un simbolo (IfcSpace) per la rappresentazione spaziale delle aree da mantenere libere per gli accessi e le vie di intervento dei vigili del fuoco nel modello.


    **Indicazione per la modellazione:**

    L''area da mantenere libera è modellata come IfcSpace mediante estrusione con altezza di 1 m e posizionata nell''area in cui il requisito corrispondente è rilevante.'
  en: ''
