name:
  de: Feuerwehr Objekt
  fr: Objet pompier
  it: Oggetto vigili del fuoco
  en: Fire department object
needed_in_domain:
- armasuisse:domain/einsatzplan-feuerwehr
definition:
  de: 'Das Feuerwehr-Objekt ist ein Platzhaltersymbol, das die räumliche Positionierung der folgenden brandschutztechnischen Elemente kennzeichnet:


    - DeploymentArea: Aufstellbereich

    - MobileFan: Mobiler Lüfter

    - KeyDepository: Schlüsselbox

    - FireFightingLift: Feuerwehraufzug

    - FlashLight: Taschenlampe

    - FireHydrant: Feuerhydrant



    **Modellierungshinweis:**

    Das Feuerwehr-Objekt wird als einfacher Kubus (Quader) modelliert und in dem Bereich platziert, in dem sich das jeweilige reale Element befindet.'
  fr: 'L''objet pompier est un symbole de remplacement qui indique le positionnement spatial des éléments de protection incendie suivants :


    - DeploymentArea: Aire de déploiement

    - MobileFan: Ventilateur mobile

    - KeyDepository: Boîte à clés

    - FireFightingLift: Ascenseur pompier

    - FlashLight: Lampe de poche

    - FireHydrant: Bouche d''incendie



    **Note pour la modélisation :**

    L''objet pompier est modélisé comme un cube simple (parallélépipède) et placé dans la zone où se trouve l''élément réel correspondant.'
  it: 'L''oggetto vigili del fuoco è un simbolo segnaposto che indica il posizionamento spaziale dei seguenti elementi di protezione antincendio:


    - DeploymentArea: Area di schieramento

    - MobileFan: Ventilatore mobile

    - KeyDepository: Cassetta delle chiavi

    - FireFightingLift: Ascensore per vigili del fuoco

    - FlashLight: Torcia

    - FireHydrant: Idrante



    **Indicazione per la modellazione:**

    L''oggetto vigili del fuoco è modellato come un cubo semplice (parallelepipedo) e posizionato nell''area in cui si trova l''elemento reale corrispondente.'
  en: ''
