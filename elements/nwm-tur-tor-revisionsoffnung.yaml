definition:
  de: 'Modellieren Sie alle Türen, Toren und Revisionsöffnungen.


    **Modellierungshinweise:**

    - Glasflächen in Türen sind mit einem transparenten Material zu modellieren.

    - Halten Sie den Detailierungsgrad besser klein und arbeiten Sie mit einer Türliste für zusätzliche Anforderungen.

    - Führen Sie ab Bauprojekt eine eindeutige Türnummer als Verknüpfung zur Türliste mit den weiteren Eigenschaften.

    - Modellieren sie die Türen geschlossen. Der Bewegungsraum von Türen kann als eigenes Element ergänzt werden.'
  fr: "Modélisez toutes les portes, portails et trappes d'inspection.\n\n**Note pour la modélisation.** \n- Les surfaces vitrées des portes doivent être modélisées avec un matériau transparent. \n- Il est\
    \ préférable de maintenir un niveau de détail faible et de travailler avec une liste de portes pour les exigences supplémentaires. \n- Dès le projet de construction, conserver un numéro de porte unique\
    \ comme lien vers la liste des portes avec les autres propriétés. \n- Modéliser les portes fermées. L'espace de mouvement des portes peut être ajouté en tant qu'élément séparé."
  it: "Modellare tutte le porte, le aperture di ispezione e tutti i portoni.   \n\n**Indicazioni per la modellazione.**\n - Le superfici vetrate di porte devono essere modellate con materiale trasparente.\
    \ \n- È meglio mantenere basso il livello di dettaglio e lavorare con un elenco di porte per eventuali requisiti aggiuntivi. \n- Dal progetto di costruzione in poi, mantenere un numero di porta univoco\
    \ come collegamento all'elenco delle porte con le altre proprietà. \n- Modellare le porte chiuse. Lo spazio di movimento delle porte può essere integrato come elemento separato."
  en: ''
