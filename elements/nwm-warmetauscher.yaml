definition:
  de: Ein Wärmeübertrager ist ein Gerät, das die Temperatur zwischen zwei Fluiden überträgt, ohne dass sie sich vermischen. Er dient dazu, eine gewünschte Temperatur zu kühlen, zu erwärmen oder aufrechtzuerhalten.
  fr: Un transmetteur de chaleur est un équioement qui transfère une température entre deux fluides sans qu'ils se mélangent. Il sert à refroidir, chauffer, ou maintenir une température désirée.
  it: Un scambiatore di calore è un'apparecchiatura che trasferisce la temperatura tra due fluidi senza che si mescolino. Serve a raffreddare, riscaldare o mantenere una temperatura desiderata.
  en: ''
