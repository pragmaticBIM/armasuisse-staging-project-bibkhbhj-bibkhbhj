      une analyse cohérente tout au long de la planification, de l’exécution et de l’exploitation.
    it: Ogni componente tecnico dell’edificio deve essere assegnato a un sistema tecnico. Questa assegnazione garantisce una definizione chiara delle funzioni, delle dipendenze e delle responsabilità, e
      consente una valutazione coerente durante la pianificazione, l’esecuzione e la gestione operativa.
