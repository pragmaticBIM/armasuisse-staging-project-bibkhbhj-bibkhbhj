id: armasuisse:element/decken-flachdacher
sort_order: 14
status: active
name:
  de: Decken / Flachdächer
  fr: Dalles / Toitures plates
  it: Solai / Tetti piani
  en: ''
needed_in_domain:
- armasuisse:domain/architektur
definition:
  de: 'Flaechiges horizontales oder geneigtes Bauteil wie Decke oder Bodenplatte. Modellierungshinweis: Das Geschoss beinhaltet die untere Decke, nicht die darueberliegende.'
  fr: 'Element horizontal ou incline tel qu’une dalle ou une toiture. Conseil de modelisation : Le niveau comprend la dalle inferieure et non celle situee au-dessus.'
  it: 'Elemento orizzontale o inclinato come solaio o platea. Indicazione di modellazione: Il piano comprende il solaio inferiore e non quello sovrastante.'
  en: ''
entity_ifc2x3: null
entity_ifc4: IfcSlab
entity_ifc4_3: ''
picture_link: null
model_link: null
applicability: entity_ifc4=IfcSlab AND PredefinedType
attributes:
- name: PredefinedType
  pset: null
  definition:
    de: 'Der PredefinedType definiert die Art der Decke oder des Flachdachs genauer.


      FLOOR … Decke

      ROOF … Dach / Flachdach

      LANDING … Podest

      BASESLAB … Bodenplatte'
    fr: 'Le PredefinedType definit plus precisement le type de dalle ou de toiture plate.


      FLOOR … Dalle

      ROOF … Toiture / toiture plate

      LANDING … Palier

      BASESLAB … Dalle de fondation'
    it: 'Il PredefinedType definisce in modo piu preciso il tipo di solaio o di copertura piana.


      FLOOR … Solaio

      ROOF … Copertura / tetto piano

      LANDING … Pianerottolo

      BASESLAB … Platea di fondazione'
    en: ''
