id: armasuisse:element/feuer-diamant
sort_order: 12
status: active
name:
  de: Feuer-Diamant
  fr: Diamant de feu
  it: Diamante di fuoco
  en: Fire Diamond
needed_in_domain:
- armasuisse:domain/einsatzplan-feuerwehr
definition:
  de: 'Der Feuer-Diamant ist ein Symbol (IfcSpace) zur räumlichen Darstellung brandschutz- und feuerwehrrelevanter Anlagen und Anforderungen im Modell. Die Attribute dokumentieren die im Raum vorhandenen
    oder erforderlichen brandschutztechnischen Einrichtungen.


    **Modellierungshinweis:**

    Der Feuer-Diamant wird als IfcSpace modelliert und in dem Bereich platziert wo die entsprechende Anforderung relevant ist.'
  fr: 'Le diamant feu est un symbole (IfcSpace) pour la représentation spatiale des installations et exigences pertinentes pour la protection incendie et les pompiers dans le modèle. Les attributs documentent
    les équipements de protection incendie présents ou requis dans le local.


    **Note pour la modélisation :**

    Le diamant feu est modélisé comme IfcSpace et placé dans la zone où l''exigence correspondante est pertinente.'
  it: 'Il diamante fuoco è un simbolo (IfcSpace) per la rappresentazione spaziale di impianti e requisiti rilevanti per la protezione antincendio e i vigili del fuoco nel modello. Gli attributi documentano
    le apparecchiature di protezione antincendio presenti o richieste nel locale.


    **Indicazione per la modellazione:**

    Il diamante fuoco è modellato come IfcSpace e posizionato nell''area in cui il requisito corrispondente è rilevante.'
  en: ''
entity_ifc2x3: null
entity_ifc4: IfcSpace
entity_ifc4_3: ''
picture_link: null
model_link: null
applicability: entity_ifc4=IfcSpace AND ObjectType=FIREDIAMOND
