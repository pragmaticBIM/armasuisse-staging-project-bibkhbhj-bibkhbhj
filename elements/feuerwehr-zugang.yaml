definition:
  de: 'Das Feuerwehrzugangssymbol kennzeichent wo die folgenden Feuerwehrzuänge sind:


    - MainAccess ... Feuerwehrhauptzugang

    - AdditionalAccess ... Feuerwehrnebenzugang

    - SprinklerCentralAccess ... Zugang Sprinklerraum


    **Modellierungshinweis:**

    Als Pfeil modeliert und im Bereich der Eingänge platziert.'
  fr: 'Le symbole d''accès des pompiers indique l''emplacement des accès suivants pour les pompiers :


    - MainAccess ... Accès principal des pompiers

    - AdditionalAccess ... Accès secondaire des pompiers

    - SprinklerCentralAccess ... Accès à la salle des sprinklers


    **Remarque de modélisation :**

    Modélisé sous forme de flèche et placé dans la zone des entrées.'
  it: 'Il simbolo di accesso dei vigili del fuoco indica dove si trovano i seguenti accessi per i vigili del fuoco:


    - MainAccess ... Accesso principale dei vigili del fuoco

    - AdditionalAccess ... Accesso secondario dei vigili del fuoco

    - SprinklerCentralAccess ... Accesso alla stanza degli sprinkler


    **Nota di modellazione:**

    Modellato come freccia e posizionato nell''area degli ingressi.'
  en: ''
