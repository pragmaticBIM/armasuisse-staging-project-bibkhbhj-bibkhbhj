definition:
  de: 'Darstellung von Sammel- und Rendezvous-Punkten im Modell Einsatzplan Feuerwehr.


    **Modellierungshinweis:**

    Der Sammelplatz wird als IfcSpace mit Höhe 1m extrudiert modelliert.'
  fr: 'Le point de rassemblement est un symbole (IfcSpace) pour la représentation spatiale des points de rassemblement et de rendez-vous dans le plan d''intervention des pompiers dans le modèle.


    **Note pour la modélisation :**

    Le point de rassemblement est modélisé comme IfcSpace par extrusion avec une hauteur de 1 m.'
  it: 'Il punto di raccolta è un simbolo (IfcSpace) per la rappresentazione spaziale dei punti di raccolta e di incontro nel piano d''intervento dei vigili del fuoco nel modello.


    **Indicazione per la modellazione:**

    Il punto di raccolta è modellato come IfcSpace mediante estrusione con altezza di 1 m.'
  en: ''
