- name: PredefinedType
  pset: null
  definition:
    de: 'Der PredefinedType definiert die Art der Wand genauer.


      STANDARD … Standardwand

      PARTITIONING … Trennwand

      SHEAR … Aussteifungswand

      PARAPET … Bruestung

      MOVABLE … Bewegliche Wand

      PLUMBINGWALL … Installationswand

      SOLIDWALL … Massive Wand

      POLYGONAL … Polygonale Wand'
    fr: 'Le PredefinedType definit plus precisement le type de mur.


      STANDARD … Mur standard

      PARTITIONING … Cloison

      SHEAR … Voile de contreventement

      PARAPET … Parapet

      MOVABLE … Mur mobile

      PLUMBINGWALL … Mur technique

      SOLIDWALL … Mur massif

      POLYGONAL … Mur polygonal'
    it: 'Il PredefinedType definisce in modo piu preciso il tipo di parete.


      STANDARD … Parete standard

      PARTITIONING … Parete divisoria

      SHEAR … Parete di controventamento

      PARAPET … Parapetto

      MOVABLE … Parete mobile

      PLUMBINGWALL … Parete tecnica

      SOLIDWALL … Parete massiccia

      POLYGONAL … Parete poligonale'
    en: ''
