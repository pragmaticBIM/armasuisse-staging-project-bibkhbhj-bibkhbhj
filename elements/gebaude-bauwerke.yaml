definition:
  de: "Gebäude sind mit dem Boden fest verbundene Bauten. Bei Doppel-, Gruppen- und Reihenhäusern zählt jedes Gebäude in der Regel als selbstständig, wenn es einen eigenen Zugang von aussen hat und wenn\
    \ zwischen den Gebäuden eine senkrechte, vom Erdgeschoss bis zum Dach reichende, tragende Trennmauer besteht. In Abstimmung mit dem Projektleiter Bauherr darf von dieser Definition abgewichen werden.\n\
    \n**Modellierungshinweis**\n\n \n\n- Gebäudetechnische Anlagen (GTA) sind grundsätzlich als Systeme zu verstehen und bilden funktionale Einheiten.\n\n- Die funktionale Abgrenzung einer Anlage erfolgt\
    \ gemäss fachlicher Logik des planenden Ingenieurs.\n\n- Die Anlagen werden in der Anlagenliste definiert und eindeutig identifiziert.\n\n- Bauteile sind grundsätzlich als Bestandteil einer Anlage zu\
    \ betrachten und werden nicht isoliert geführt.\n \n- Die Lieferung der Anlageninformationen erfolgt primär über die GTA-Erfassungslisten (Excel).\n\n- Eine Modellierung der Anlagen im BIM-Modell ist\
    \ nicht zwingend erforderlich.\n\n- Alternativ können die Informationsanforderungen über ein IFC-Modell bereitgestellt werden.\n\n \n\n**Allgemeine Regeln für alle Umsetzungsprofile**\n\n- Eine Anlage\
    \ wird genau einmal definiert und eindeutig identifiziert.\n \n- Die Anlagen-ID (Attribut „Name“) ist das führende Identifikationsmerkmal.\n\n- Fehlende oder mehrfache Zuordnungen Bauteilen zu Anlagen\
    \ sind nicht zulässig.\n\n \n\n**Umsetzungsprofile BIM Light 2D und BIM Full 2D**\n\n- Anlagen sind vollständig über die GTA-Erfassungslisten abzubilden.\n\n \n\n**Umsetzungsprofile BIM Light 3D und\
    \ BIM Full 3D**\n\n- Die Modellierung hat systemorientiert zu erfolgen.\n \n- Anlagen können als IfcDistributionSystem strukturiert und eindeutig identifiziert werden.\n\n- Die Systeme sind mit den\
    \ geforderten Attributen und Properties der Anlage auszustatten.\n\n- Jedes 3D-Objekt muss genau einer Anlage zugeordnet sein.\n\n- Die Zuordnung der 3D-Objekte erfolgt über das Attribut *RelationToSystem*\
    \ unter Verwendung der Anlagen-ID (Attribut „Name“) der Anlage.\n\n- Die Zuordnung ist maschinenlesbar und für alle zugehörigen Objekte konsistent umzusetzen."
  fr: "Les bâtiments sont des constructions solidement fixées au sol. Dans le cas de maisons jumelées, groupées ou mitoyennes, chaque bâtiment est généralement considéré comme indépendant s'il dispose de\
    \ son propre accès depuis l'extérieur et s'il existe entre les bâtiments un mur de séparation vertical porteur allant du rez-de-chaussée au toit. En accord avec le chef de projet du maître d'ouvrage,\
    \ il est possible de s'écarter de cette définition. \n\n**Note pour la modélisation.**\nLa répartition en bâtiments doit être clarifiée au préalable avec le chef de projet. Les critères peuvent être\
    \ : \n- Répartition des coûts / sous-objets \n- Réduction de la taille du fichier pour de meilleures performances \n- Étapes \n- ...\n\n**Indications de modélisation**\n Les installations techniques\
    \ du bâtiment (GTA) doivent être considérées comme des systèmes et constituent des unités fonctionnelles.\n\n- La délimitation fonctionnelle d’une installation se fait selon la logique métier de l’ingénieur\
    \ planificateur.\n\n- Les installations sont définies et identifiées de manière univoque dans la liste des installations.\n\n- Les composants doivent être considérés comme faisant partie d’une installation\
    \ et ne sont pas traités de manière isolée.\n\n- La livraison des informations relatives aux installations se fait principalement via les listes de saisie GTA (Excel).\n\n- Une modélisation des installations\
    \ dans le modèle BIM n’est pas obligatoire.\n\n- Les exigences d’information peuvent alternativement être fournies via un modèle IFC.\n \n \n\n**Règles générales pour tous les profils de mise en œuvre**\n\
    \n- Une installation est définie une seule fois et identifiée de manière univoque.\n\n- L’identifiant de l’installation (attribut « Name ») est le principal élément d’identification.\n\n- Les affectations\
    \ manquantes ou multiples de composants à des installations ne sont pas autorisées.\n\n \n\n**Profils de mise en œuvre BIM Light 2D et BIM Full 2D**\n\n- Les installations doivent être entièrement représentées\
    \ via les listes de saisie GTA.\n\n \n\n**Profils de mise en œuvre BIM Light 3D et BIM Full 3D**\n\n- La modélisation doit être orientée système.\n\n- Les installations peuvent être structurées et identifiées\
    \ de manière univoque en tant que IfcDistributionSystem.\n\n- Les systèmes doivent être dotés des attributs et propriétés requis de l’installation.\n\n- Chaque objet 3D doit être attribué à une seule\
    \ installation.\n\n- L’attribution des objets 3D se fait via l’attribut *RelationToSystem* en utilisant l’identifiant de l’installation (attribut « Name »).\n\n- L’attribution doit être lisible par\
    \ machine et appliquée de manière cohérente à tous les objets concernés."
  it: "Gli edifici sono strutture saldamente ancorate al suolo. \nNel caso di case abbinate, a gruppi e a schiera, ogni edificio è generalmente considerato indipendente se ha un proprio accesso dall'esterno\
    \ e se esiste un muro divisorio verticale portante tra gli edifici che si estende dal piano terra al tetto. \nQuesta definizione può essere derogata in consultazione con il capoprogetto del committente.\n\
    \n**Indicazioni di modellazione**\n\n \n\n- Gli impianti tecnici (GTA) devono essere considerati come sistemi e costituiscono unità funzionali.\n\n- La delimitazione funzionale di un impianto avviene\
    \ secondo la logica tecnica dell’ingegnere progettista.\n\n- Gli impianti sono definiti e identificati in modo univoco nella lista degli impianti.\n\n- I componenti devono essere considerati come parti\
    \ di un impianto e non sono gestiti in modo isolato.\n\n- La consegna delle informazioni relative agli impianti avviene principalmente tramite le liste di rilevamento GTA (Excel).\n\n- La modellazione\
    \ degli impianti nel modello BIM non è obbligatoria.\n\n- I requisiti informativi possono alternativamente essere forniti tramite un modello IFC.\n\n \n\n**Regole generali per tutti i profili di implementazione**\n\
    \n- Un impianto è definito una sola volta ed è identificato in modo univoco.\n\n- L’identificativo dell’impianto (attributo « Name ») è l’elemento principale di identificazione.\n\n- Le assegnazioni\
    \ mancanti o multiple dei componenti agli impianti non sono ammesse.\n\n \n\n**Profili di implementazione BIM Light 2D e BIM Full 2D**\n\n- Gli impianti devono essere completamente rappresentati tramite\
    \ le liste di rilevamento GTA.\n\n \n\n**Profili di implementazione BIM Light 3D e BIM Full 3D**\n\n- La modellazione deve essere orientata al sistema.\n\n- Gli impianti possono essere strutturati e\
    \ identificati in modo univoco come IfcDistributionSystem.\n\n- I sistemi devono essere dotati degli attributi e delle proprietà richieste dell’impianto.\n\n- Ogni oggetto 3D deve essere assegnato a\
    \ un solo impianto.\n\n- L’assegnazione degli oggetti 3D avviene tramite l’attributo *RelationToSystem* utilizzando l’identificativo dell’impianto (attributo « Name »).\n\n- L’assegnazione deve essere\
    \ leggibile dalla macchina e applicata in modo coerente a tutti gli oggetti interessati."
