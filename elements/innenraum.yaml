- name: FloorCovering
  pset: Pset_SpaceCoveringRequirements
  definition:
    de: "Bodenbelag Bezeichnung gemäss Klassifikation Bodenbelagstypen von armasuisse. Diese Information wird in weitere Unterhaltsysteme übernommen. \n\nFür die Bausetelle kann es Sinn machen, Bodenbelag\
      \ und Unterlagsboden als einzelne Schichten (IfcCovering) zu modellieren. \n\nWenn mehrere Bodenbeläge in einem Raum vorkommen, den Wert \"Multicovering\" eintragen und die Bodenbeläge als einzelne\
      \ Schicht modellieren."
    fr: 'Revêtement de sol désignation selon la classification des types de revêtements de sol d''armasuisse. Cette information est transférée aux autres systèmes d''entretien.


      Pour le chantier de construction, il peut être pertinent de modéliser le revêtement de sol et le sous-sol comme des couches distinctes (IfcCovering).


      Lorsque plusieurs revêtements de sol se trouvent dans une même pièce, entrer la valeur "Multicovering" et modéliser les revêtements de sol comme des couches individuelles.'
    it: "Rivestimento del pavimento denominazione secondo la classificazione dei tipi di rivestimento del pavimento di armasuisse. Questa informazione viene trasferita ad altri sistemi di manutenzione.\n\
      \ \nPer il cantiere, può avere senso modellare il rivestimento del pavimento e il sottofondo come strati separati (IfcCovering).\n\nSe in una stanza sono presenti più rivestimenti del pavimento, inserire\
      \ il valore \"Multicovering\" e modellare i rivestimenti del pavimento come strati singoli."
    en: ''
